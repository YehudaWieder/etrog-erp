server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend — URL injected at runtime via BACKEND_URL env var
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's default 60s read/send timeout is shorter than the 5-minute Prisma transaction
        # timeout some write endpoints allow for (see PrismaService/harvest & shipment workflow
        # services) — raise both so a slow-but-legitimate long transaction isn't cut off here.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
